name: Web installer reports need diagnostics

# A web installer problem (label web-installer, set by .github/ISSUE_TEMPLATE/web_installer.yml) must carry
# the page's diagnostics zip. The form requires the upload, but an issue can still lose it (edited
# afterwards, or labelled by hand). Without a .zip attachment the issue gets needs-diagnostics and one
# comment saying how to get the file; once one is attached the label comes off again.

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  issues: write

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'web-installer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const MARK = "<!-- kraken-diagnostics-check -->";
            const LABEL = "needs-diagnostics";
            // an uploaded file: github.com/user-attachments/files/<id>/<name>.zip (older: <owner>/<repo>/files/...)
            const zip = /https:\/\/github\.com\/(?:user-attachments|[^\s\/]+\/[^\s\/]+)\/files\/\d+\/[^\s)\]]+\.zip/i;
            const has = zip.test(issue.body || "");
            const labels = issue.labels.map((l) => l.name);
            if (has) {
              if (labels.includes(LABEL)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: LABEL });
              }
              core.info("diagnostics zip attached");
              return;
            }
            if (!labels.includes(LABEL)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [LABEL] });
            }
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number });
            if (comments.some((c) => (c.body || "").includes(MARK))) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: [
                MARK,
                "This report has no diagnostics file, and installer problems can't be looked into without one.",
                "",
                "1. Open the installer page and do what you did before, until the problem happens again.",
                "2. Before reloading the page, click **Download diagnostics** at the bottom (or **Save diagnostics** on the error screen).",
                "3. Edit this issue and drag the `kraken-diagnostics-….zip` file into it.",
                "",
                "The label `needs-diagnostics` comes off by itself once the file is attached.",
              ].join("\n"),
            });
